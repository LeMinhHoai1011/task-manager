# Local Windows development profile. Set SPRING_PROFILES_ACTIVE=local.
# Credentials are read from environment variables, never committed here.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/smarttask}
    username: ${SPRING_DATASOURCE_USERNAME:smarttask}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

file:
  gateway:
    mode: ${FILE_GATEWAY_MODE:local}
    local-root: ${FILE_GATEWAY_LOCAL_ROOT:./var/files}
    minio-endpoint: ${FILE_GATEWAY_MINIO_ENDPOINT:http://127.0.0.1:9000}
    minio-access-key: ${FILE_GATEWAY_MINIO_ACCESS_KEY:}
    minio-secret-key: ${FILE_GATEWAY_MINIO_SECRET_KEY:}
    minio-bucket: ${FILE_GATEWAY_MINIO_BUCKET:smarttask}

smarttask:
  cors:
    allowed-origins: ${SMARTTASK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ollama:
    base-url: ${SMARTTASK_OLLAMA_BASE_URL:http://127.0.0.1:11434}
