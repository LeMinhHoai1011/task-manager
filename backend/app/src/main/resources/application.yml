server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smarttask
    username: smarttask
    password: smarttask
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

file:
  gateway:
    mode: local
    local-root: ./var/files
    minio-endpoint: http://localhost:9000
    minio-access-key: minio
    minio-secret-key: minio123
    minio-bucket: smarttask
smarttask:
  self-registration: true
  bootstrap:
    admin-username: admin
  push:
    scan:
      delay: 60000

logging:
  level:
    vn.smarttask: INFO
