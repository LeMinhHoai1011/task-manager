server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/smarttask}
    username: ${SPRING_DATASOURCE_USERNAME:smarttask}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

file:
  gateway:
    mode: local
    local-root: ./var/files
    minio-endpoint: http://localhost:9000
    minio-access-key: ${FILE_GATEWAY_MINIO_ACCESS_KEY:}
    minio-secret-key: ${FILE_GATEWAY_MINIO_SECRET_KEY:}
    minio-bucket: smarttask
smarttask:
  self-registration: true
  bootstrap:
    admin-username: admin
  push:
    scan:
      delay: 60000

logging:
  level:
    vn.smarttask: INFO
    # Request/response DTOs can contain credentials and opaque session tokens.
    # Keep Spring MVC body logging disabled even when root logging is DEBUG.
    org.springframework.web: INFO
