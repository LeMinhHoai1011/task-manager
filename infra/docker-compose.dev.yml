# SmartTask — dev stack (Postgres + MinIO + MailHog).
# KHONG co ollama (DEC-41 chua chot ha tang AI; tuyet doi khong chay AI o V1).
name: smarttask-dev

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smarttask
      POSTGRES_USER: stm_dev
      POSTGRES_PASSWORD: stm_dev_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stm_dev -d smarttask"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: stm_minio
      MINIO_ROOT_PASSWORD: stm_minio_pw_123
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
